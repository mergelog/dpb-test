name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # Branch protection requires a human approval before GitHub can merge.
      # This privileged workflow does not check out or execute PR contents.
      - name: Enable auto-merge after required approval
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
