version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
